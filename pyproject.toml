[project]
name = "hdb-rentals"
version = "0.1.0"
description = "EDA and rent prediction on Singapore HDB rental approvals"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.15",
    "seaborn>=0.13",
    "statsmodels>=0.15.0",
    "lightgbm>=4.6",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
]

# Installs src/hdb_rentals in editable mode on `uv sync`, so notebooks can
# `import hdb_rentals` from any folder.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Build .venv on a uv-installed Python, never on whatever conda Python is on PATH.
python-preference = "only-managed"

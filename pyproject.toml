[project]
name = "hdb-rentals"
version = "0.1.0"
description = "EDA and rent prediction on Singapore HDB rental approvals"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.15",
    "seaborn>=0.13",
    "statsmodels>=0.15.0",
    "lightgbm>=4.6",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
    "torch>=2.15.0",
    "nbformat>=5.11.1",
]

[tool.uv]
# Nothing to install: the shared code lives in notebooks/0_shared_code.ipynb.
package = false
# Build .venv on a uv-installed Python, never on whatever conda Python is on PATH.
python-preference = "only-managed"
